<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            height: 100vh;
        }

        .logo {
            position: fixed;
            top: 20px;
            left: 60px;
            height: 60px;
            width: auto;
            z-index: 1000;
        }

        .header-text {
            position: fixed;
            top: 20px;
            right: 60px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #ffffff;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <img src="newlogo.png" alt="Logo" class="logo">
    <div class="header-text">Making Mujaahid</div>
</body>
</html>
