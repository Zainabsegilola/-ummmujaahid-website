<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            height: 100vh;
        }

        .logo {
            position: fixed;
            top: 10px;
            left: 120px;
            height: 60px;
            width: auto;
            z-index: 1000;
        }

        .header-text {
            position: fixed;
            top: 10px;
            right: 120px;
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            font-weight: 100;
            color: #ffffff;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <img src="newlogo.png" alt="Logo" class="logo">
    <div class="header-text">Making Mujaahid</div>
</body>
</html>
